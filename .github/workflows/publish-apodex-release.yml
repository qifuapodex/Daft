name: Build and publish apodex wheels

# Multi-platform wheels on GitHub-hosted runners, uploaded to a GitHub Release.
# Does not publish to PyPI. Trigger manually from Actions, or push an `apodex-*` tag.
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: GitHub release tag to create or update
        required: true
        default: apodex-0.7.24.3
      package_version:
        description: Wheel version written into Cargo.toml (PEP 440 / Cargo semver)
        required: true
        default: "0.7.24+apodex.3"
      run_tests:
        description: Run dataframe tests on the Linux x86_64 wheel
        type: boolean
        default: false
      use_lto:
        description: Link-time optimization (slower build, faster binary)
        type: boolean
        default: true
  push:
    tags:
    - apodex-*

permissions: {}

concurrency:
  group: apodex-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DAFT_ANALYTICS_ENABLED: "0"
  DAFT_PROGRESS_BAR: "0"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: "Build Daft wheel for ${{ matrix.os }}-${{ matrix.arch }}"
    permissions:
      contents: read
    uses: ./.github/workflows/build-wheel.yml
    with:
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      lts: false
      build_type: release
      # Fat LTO on Linux aarch64 (cross-compile from ubuntu-latest) is SIGKILL'd
      # by the kernel after ~1h of linking. Other platforms keep LTO.
      use_lto: ${{ (matrix.os != 'ubuntu' || matrix.arch != 'aarch64') && (github.event_name != 'workflow_dispatch' || inputs.use_lto) }}
      run_tests: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tests }}
      package_version: ${{ github.event_name == 'workflow_dispatch' && inputs.package_version || '0.7.24+apodex.3' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
        arch: [x86_64, aarch64]
        exclude:
        - os: windows
          arch: aarch64

  publish:
    name: Publish wheels to GitHub Release
    # Publish whatever platforms succeeded, even if one matrix cell failed.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        pattern: wheels-*
        merge-multiple: true
        path: dist
    - name: List wheels
      run: ls -la dist
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: apodex-0.7.24.3
        name: apodex-0.7.24.3
        target_commitish: ${{ github.sha }}
        body_path: .github/release-notes/apodex-0.7.24.3.md
        files: dist/*
        fail_on_unmatched_files: true
        make_latest: true
    - name: Check expected platforms
      run: |
        python3 - <<'PY'
        from pathlib import Path
        names = sorted(p.name for p in Path("dist").iterdir() if p.is_file())
        print("published files:")
        for n in names:
            print(f"  {n}")
        checks = [
            ("linux x86_64", lambda s: "manylinux_2_24_x86_64" in s),
            ("linux aarch64", lambda s: "manylinux" in s and "aarch64" in s),
            ("macos x86_64", lambda s: "macosx" in s and "x86_64" in s),
            ("macos arm64", lambda s: "macosx" in s and "arm64" in s),
            ("windows x86_64", lambda s: "win_amd64" in s),
        ]
        missing = [label for label, pred in checks if not any(pred(n) for n in names)]
        if missing:
            print("missing platforms:", ", ".join(missing))
            raise SystemExit(1)
        print("all expected platforms present")
        PY
