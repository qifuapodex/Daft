name: Build and publish apodex wheels

# Multi-platform wheels on GitHub-hosted runners, uploaded to a GitHub Release.
# Does not publish to PyPI. Trigger manually from Actions, or push an `apodex-*` tag.
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: GitHub release tag to create or update
        required: true
        default: apodex-0.7.24.7
      package_version:
        description: Wheel version written into Cargo.toml (PEP 440 / Cargo semver)
        required: true
        default: "0.7.24+apodex.7"
      run_tests:
        description: Run dataframe tests on the Linux x86_64 wheel
        type: boolean
        default: false
      use_lto:
        description: Link-time optimization (slower build, faster binary)
        type: boolean
        default: true
  push:
    tags:
    - apodex-*
    - '!apodex-assets-*'

permissions: {}

concurrency:
  group: apodex-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DAFT_ANALYTICS_ENABLED: "0"
  DAFT_PROGRESS_BAR: "0"

defaults:
  run:
    shell: bash

jobs:
  release-notes:
    name: Publish release notes before building
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag_name || 'apodex-0.7.24.7' }}
        name: ${{ inputs.package_version || '0.7.24+apodex.7' }}
        target_commitish: ${{ github.sha }}
        body_path: .github/release-notes/${{ inputs.tag_name || 'apodex-0.7.24.7' }}.md
        make_latest: true

  build:
    needs: release-notes
    name: "Build Daft wheel for ${{ matrix.os }}-${{ matrix.arch }}"
    permissions:
      contents: read
    uses: ./.github/workflows/build-wheel.yml
    with:
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      lts: false
      build_type: release
      # Fat LTO on Linux aarch64 (cross-compile from ubuntu-latest) is SIGKILL'd
      # by the kernel after ~1h of linking. Other platforms keep LTO.
      use_lto: ${{ (matrix.os != 'ubuntu' || matrix.arch != 'aarch64') && (github.event_name != 'workflow_dispatch' || inputs.use_lto) }}
      run_tests: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tests }}
      package_version: ${{ github.event_name == 'workflow_dispatch' && inputs.package_version || '0.7.24+apodex.7' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
        arch: [x86_64, aarch64]
        exclude:
        - os: windows
          arch: aarch64

  publish:
    name: Publish each platform as soon as it is ready
    runs-on: ubuntu-latest
    timeout-minutes: 370
    needs: release-notes
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/checkout@v7
    - name: Upload completed platform artifacts
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BUILD_RUN_ID: ${{ github.run_id }}
        BUILD_SHA: ${{ github.sha }}
        RELEASE_TAG: ${{ inputs.tag_name || 'apodex-0.7.24.7' }}
        PACKAGE_VERSION: ${{ inputs.package_version || '0.7.24+apodex.7' }}
      run: |
        python3 .github/scripts/publish_apodex_artifacts.py \
          --run-id "$BUILD_RUN_ID" --sha "$BUILD_SHA" \
          --tag "$RELEASE_TAG" --version "$PACKAGE_VERSION"

  verify:
    name: Verify complete release assets
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    needs: [build, publish]
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        pattern: wheels-*
        merge-multiple: true
        path: dist
    - name: List wheels
      run: ls -la dist
    - name: Validate complete release assets
      env:
        PACKAGE_VERSION: ${{ inputs.package_version || '0.7.24+apodex.7' }}
      run: |
        python3 - <<'PY'
        from pathlib import Path
        names = sorted(p.name for p in Path("dist").iterdir() if p.is_file())
        print("files to publish:")
        for n in names:
            print(f"  {n}")
        checks = [
            ("linux x86_64", lambda s: "manylinux_2_24_x86_64" in s),
            ("linux aarch64", lambda s: "manylinux" in s and "aarch64" in s),
            ("macos x86_64", lambda s: "macosx" in s and "x86_64" in s),
            ("macos arm64", lambda s: "macosx" in s and "arm64" in s),
            ("windows x86_64", lambda s: "win_amd64" in s),
        ]
        missing = [label for label, pred in checks if not any(pred(n) for n in names)]
        if missing:
            print("missing platforms:", ", ".join(missing))
            raise SystemExit(1)
        import email.parser
        import os
        import tarfile
        import zipfile
        wheels = [n for n in names if n.endswith(".whl")]
        sdists = [n for n in names if n.endswith(".tar.gz")]
        if len(wheels) != 5 or len(sdists) != 1 or len(names) != 6:
            raise SystemExit("Expected exactly five wheels and one source distribution")
        for name in wheels:
            with zipfile.ZipFile(Path("dist") / name) as archive:
                metadata = [n for n in archive.namelist() if n.endswith(".dist-info/METADATA")]
                if len(metadata) != 1:
                    raise SystemExit(f"Invalid wheel metadata: {name}")
                parsed = email.parser.BytesParser().parsebytes(archive.read(metadata[0]))
            if parsed["Name"] != "daft" or parsed["Version"] != os.environ["PACKAGE_VERSION"]:
                raise SystemExit(f"Unexpected package name/version: {name}")
        with tarfile.open(Path("dist") / sdists[0]) as archive:
            metadata = [m for m in archive.getmembers() if m.name.endswith("/PKG-INFO") and m.name.count("/") == 1]
            if len(metadata) != 1:
                raise SystemExit("Invalid source distribution metadata")
            with archive.extractfile(metadata[0]) as source:
                parsed = email.parser.BytesParser().parse(source)
            if parsed["Name"] != "daft" or parsed["Version"] != os.environ["PACKAGE_VERSION"]:
                raise SystemExit("Unexpected source distribution name/version")
        print("all expected platforms and package versions verified")
        PY
