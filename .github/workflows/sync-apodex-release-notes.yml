name: Sync apodex release notes

# Local gh PAT cannot write Releases; the Actions GITHUB_TOKEN can.
# Existing tag names stay unchanged so asset URLs remain stable. This workflow
# normalizes each display title and updates its body from the markdown file.
# Wheel assets are still uploaded by "Build and publish apodex wheels".
on:
  push:
    branches:
    - release_apodex_0724

permissions:
  contents: write

concurrency:
  group: sync-apodex-release-notes
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - tag: apodex-0.7.24
          title: 0.7.24+apodex.1
          notes: .github/release-notes/apodex-0.7.24.md
        - tag: apodex-0.7.24.2
          title: 0.7.24+apodex.2
          notes: .github/release-notes/apodex-0.7.24.2.md
        - tag: apodex-0.7.24.3
          title: 0.7.24+apodex.3
          notes: .github/release-notes/apodex-0.7.24.3.md
        - tag: apodex-0.7.24.4
          title: 0.7.24+apodex.4
          notes: .github/release-notes/apodex-0.7.24.4.md
    steps:
    - uses: actions/checkout@v7
    - name: Update GitHub Release title and notes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ matrix.tag }}
        TITLE: ${{ matrix.title }}
        NOTES: ${{ matrix.notes }}
      run: |
        if ! gh release view "$TAG" >/dev/null 2>&1; then
          echo "Release $TAG does not exist yet; skipping until it is published."
          exit 0
        fi
        gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES"
        gh release view "$TAG" --json tagName,name,url
